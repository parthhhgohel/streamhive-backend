# for now only later i'll switch to paid subscription of background worker of render
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:gunicorn]
command=gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

